# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
REPO_NAME=wlshare-windows
CI_ENV_PREFIX=WLSHARE_WINDOWS
# The app is .NET, so the tree is shipped the dotnet way (bin/ and obj/ left
# behind) and `clean` drops the NuGet cache. The core is Rust and builds on the
# same VM with the machine-wide CARGO_TARGET_DIR there; its own target/ and the
# staged DLL are rebuilt, never shipped.
WINCI_STACK=dotnet
WINCI_EXTRA_EXCLUDES="./core/target ./dist ./build"
