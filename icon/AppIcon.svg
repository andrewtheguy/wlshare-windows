<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#0f1630"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf5"/>
      <stop offset="1" stop-color="#b9c1d3"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa9f5"/>
      <stop offset="0.55" stop-color="#3366cc"/>
      <stop offset="1" stop-color="#6a3fc9"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab3c7"/>
      <stop offset="1" stop-color="#d7dce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="screen">
      <rect x="226" y="262" width="572" height="366" rx="14"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824pt body, 100pt margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- stand -->
  <path d="M462 668 L562 668 L580 770 L444 770 Z" fill="url(#stand)"/>
  <rect x="380" y="762" width="264" height="24" rx="12" fill="url(#bezel)" filter="url(#soft)"/>

  <!-- display -->
  <rect x="200" y="236" width="624" height="444" rx="36" fill="url(#bezel)" filter="url(#shadow)"/>
  <g clip-path="url(#screen)">
    <rect x="226" y="262" width="572" height="366" fill="url(#wall)"/>
    <!-- a remote window -->
    <g filter="url(#soft)">
      <rect x="282" y="318" width="330" height="222" rx="14" fill="#f5f7fb"/>
      <path d="M282 332 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v22 h-330 Z" fill="#dfe4ee"/>
      <circle cx="304" cy="336" r="7" fill="#ff5f57"/>
      <circle cx="328" cy="336" r="7" fill="#febc2e"/>
      <circle cx="352" cy="336" r="7" fill="#28c840"/>
      <rect x="306" y="378" width="200" height="14" rx="7" fill="#c3cad8"/>
      <rect x="306" y="408" width="270" height="14" rx="7" fill="#d5dbe6"/>
      <rect x="306" y="438" width="234" height="14" rx="7" fill="#d5dbe6"/>
      <rect x="306" y="468" width="160" height="14" rx="7" fill="#d5dbe6"/>
    </g>
  </g>

  <!-- the pointer, driving the remote desktop -->
  <g filter="url(#soft)" transform="translate(600 452) scale(1.25)">
    <path d="M0 0 L0 118 L28 92 L46 136 L66 127 L48 84 L86 84 Z"
          fill="#111" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
  </g>
</svg>
