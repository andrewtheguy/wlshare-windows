[package]
name = "wlshare-client-core"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare-windows"
description = "The wlshare client's Windows half — its key and wheel tables and the C ABI — under the Windows app"

# `cdylib` is what the app P/Invokes — .NET loads native code only out of a
# DLL at run time, so there is no static library to link the way the macOS app
# links its core. `rlib` is what the tests build against.
[lib]
name = "wlshare_client_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The session, and every protocol byte under it, from the release this client
# was built and tested against — not the sibling checkout, so what is built here
# is the same on this machine, on the CI VM and on one that has never heard of
# `../wlshare`. Cargo.lock holds the revision the tag stood for. The macOS app
# is built on the same crate. `wlshare_rfb` comes re-exported with it, so there
# is one tag to move and no second one to fall out of step.
#
# To build against an unreleased change, point it at the checkout for as long
# as that takes, without committing anything:
#
#   cargo test --config 'patch."https://github.com/andrewtheguy/wlshare.git".wlshare-client.path="../../wlshare/crates/wlshare-client"'
#
# That rewrites Cargo.lock while it is in force, so put the pinned one back
# (`git checkout core/Cargo.lock`) before committing anything.
wlshare-client = { git = "https://github.com/andrewtheguy/wlshare.git", tag = "v0.0.38" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
